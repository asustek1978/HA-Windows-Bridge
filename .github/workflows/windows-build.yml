name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained executable
        run: dotnet publish src/HaWindowsBridge/HaWindowsBridge.csproj -c Release -r win-x64 --self-contained true -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: HAWindowsBridge_v1.0_win-x64
          path: dist/HAWindowsBridge.exe
          if-no-files-found: error
